<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32V2 | BME680</title>
<style>
:root{font-family:Arial,sans-serif;color:#e8f3fc;background:#081626}
*{box-sizing:border-box}body{margin:0}header{padding:28px max(18px,4vw);background:#122a45}
h1{font-size:clamp(24px,3vw,36px);margin:0 0 8px}p{color:#a9bed1;margin:0}
main{padding:26px max(12px,3vw)}#estado{padding:12px;margin-bottom:20px;border:1px solid #375271;border-radius:12px;background:#12243a;color:#b5dff1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.station{background:#13263e;border:1px solid #304660;border-radius:20px;padding:19px;min-width:0}
.st-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2{font-size:21px;margin:0}.status{font-size:12px;color:#8ee3b5}small{color:#93aabd}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:17px 0}
.metric{padding:15px;border:1px solid #35506b;background:#1a314d;border-radius:12px}
.metric .name{font-size:12px;color:#9cb5cc}.metric .val{font-size:clamp(22px,2.4vw,31px);font-weight:700;margin-top:7px}
.metric .unit{font-size:12px;color:#aabbd0}
.indicators{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.indicator{padding:10px;background:#102238;border:1px solid #304660;border-radius:12px;text-align:center}
.indicator h3{font-size:13px;color:#bdd0e2}.gauge{width:100%;max-width:240px}
.thermo{height:140px;width:34px;margin:15px auto;border-radius:20px;border:4px solid #8ca7c0;background:#263951;position:relative;overflow:hidden}
.thermo .fill{position:absolute;bottom:0;width:100%;height:0%;background:linear-gradient(#ffa578,#f0595b);transition:height .6s}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.chart{background:#0d2035;border:1px solid #2c4762;border-radius:12px;padding:12px;min-width:0}
.chart h3{font-size:13px;margin:0 0 10px;color:#b5cbe0}
.chart svg{display:block;width:100%;height:125px;overflow:visible}.chart text{fill:#8daac4;font-size:9px}
.last{margin:15px 0;color:#98bdd0;font-size:12px}.table-wrap{overflow:auto;max-height:230px}
table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th,td{padding:9px;border-bottom:1px solid #314b65;text-align:left}th{color:#9bb9d1}
@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:450px){.charts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>ESP32V2 · Monitor BME680</h1><p>Dos estaciones ESP32-C5 · Mediciones e historial desde Firebase Realtime Database</p></header>
<main><div id="estado">Conectando con Firebase...</div><section class="grid" id="estaciones"></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,onValue,query,orderByChild,limitToLast} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';

// Web API key del proyecto ESP32V2, NO la del proyecto anterior.
const firebaseConfig = {
  apiKey: 'AIzaSyAH_nt9yfY9NULWqdU365XN3lOfVjVOIMg',
  authDomain: 'esp32v2-3270a.firebaseapp.com',
  databaseURL: 'https://esp32v2-3270a-default-rtdb.firebaseio.com',
  projectId: 'esp32v2-3270a'
};
const devices=['esp32c5_01','esp32c5_02'];
const metrics=[
  ['temperatura','Temperatura','°C','#f29a7a'],
  ['humedad','Humedad','%','#6ae3ca'],
  ['presion_hpa','Presión','hPa','#b1a1ff'],
  ['gas_kohm','Resistencia de gas','kΩ','#ffcc75']
];
const latest={};
const histories={};
const fmt=(n,d=1)=>Number.isFinite(Number(n))&&n!=null?Number(n).toFixed(d):'—';
const fecha=ts=>ts?new Date(ts).toLocaleString('es-CO',{timeZone:'America/Bogota'}):'Sin fecha';
function create(){
 document.getElementById('estaciones').innerHTML=devices.map((id,i)=>`
 <article class="station" id="${id}">
  <div class="st-head"><h2>ESP32-C5 ${i+1} · BME680</h2><span class="status" data="status">Sin datos</span></div>
  <small>${id}</small>
  <div class="metrics">${metrics.map(([key,name,unit])=>`<div class="metric"><div class="name">${name}</div><div class="val" data="${key}">—</div><span class="unit">${unit}</span></div>`).join('')}</div>
  <div class="indicators">
    <div class="indicator"><h3>Humedad relativa</h3><svg class="gauge" viewBox="0 0 220 135"><path d="M25 110 A85 85 0 0 1 195 110" stroke="#2f4d69" stroke-width="20" fill="none"/><path d="M25 110 A85 85 0 0 1 195 110" stroke="#60d7c4" stroke-width="16" fill="none"/><line data="aguja" x1="110" y1="110" x2="25" y2="110" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="110" cy="110" r="7" fill="#fff"/><text x="110" y="130" text-anchor="middle" data="gaugeText">—</text></svg></div>
    <div class="indicator"><h3>Termómetro</h3><div class="thermo"><div class="fill" data="thermo"></div></div><small data="termotext">— °C</small></div>
  </div>
  <div class="last" data="fecha">Última medición: —</div>
  <div class="charts">${metrics.map(([key,name])=>`<div class="chart"><h3>${name}</h3><svg data-chart="${key}" viewBox="0 0 320 125" preserveAspectRatio="none"></svg></div>`).join('')}</div>
  <h3>Historial por fecha (últimos 12 registros)</h3><div class="table-wrap"><table><thead><tr><th>Fecha Bogotá</th><th>°C</th><th>%</th><th>hPa</th><th>kΩ</th></tr></thead><tbody data="tabla"></tbody></table></div>
 </article>`).join('');
}
create();
function plot(svg,arr,key,color){
 const valid=arr.map(a=>Number(a[key])).filter(Number.isFinite);
 if(!valid.length){svg.textContent='';return;}
 let lo=Math.min(...valid),hi=Math.max(...valid),spread=hi-lo||1;
 const w=320,h=110,bw=w/valid.length*.68,step=w/valid.length;
 svg.innerHTML=valid.map((v,i)=>{
   let bar=8+(v-lo)/spread*85;
   return `<rect x="${(i*step+step*.15).toFixed(1)}" y="${(h-bar).toFixed(1)}" width="${bw.toFixed(1)}" height="${bar.toFixed(1)}" rx="3" fill="${color}"><title>${fmt(v,2)}</title></rect>`;
 }).join('')+`<text x="2" y="122">${fmt(lo,1)} – ${fmt(hi,1)}</text>`;
}
function render(id){
 const box=document.getElementById(id),d=latest[id]||{},hist=histories[id]||[];
 for(const [key] of metrics)box.querySelector(`[data="${key}"]`).textContent=fmt(d[key],2);
 box.querySelector('[data="fecha"]').textContent='Última medición: '+fecha(d.fecha)+` · Wi-Fi ${d.rssi_dbm??'—'} dBm`;
 const age=Date.now()-Number(d.fecha||0);
 box.querySelector('[data="status"]').textContent=d.fecha?(age<90000?'Actualizado':'Sin datos recientes'):'Sin datos';
 if(d.humedad!=null){const angle=Math.PI*(1-Math.max(0,Math.min(100,d.humedad))/100);
 box.querySelector('[data="aguja"]').setAttribute('x2',110+75*Math.cos(angle));
 box.querySelector('[data="aguja"]').setAttribute('y2',110-75*Math.sin(angle));
 box.querySelector('[data="gaugeText"]').textContent=fmt(d.humedad)+' %';}
 if(d.temperatura!=null){box.querySelector('[data="thermo"]').style.height=Math.max(0,Math.min(100,(d.temperatura+10)/70*100))+'%';
 box.querySelector('[data="termotext"]').textContent=fmt(d.temperatura)+' °C';}
 for(const [key,, ,color] of metrics)plot(box.querySelector(`[data-chart="${key}"]`),hist.slice(-24),key,color);
 box.querySelector('[data="tabla"]').innerHTML=hist.slice(-12).reverse().map(v=>`<tr><td>${fecha(v.fecha)}</td><td>${fmt(v.temperatura)}</td><td>${fmt(v.humedad)}</td><td>${fmt(v.presion_hpa)}</td><td>${fmt(v.gas_kohm)}</td></tr>`).join('')||'<tr><td colspan="5">Sin registros</td></tr>';
}
const estado=document.getElementById('estado');
try{
 if(!firebaseConfig.apiKey)throw Error('Debes colocar la Web API key del proyecto ESP32V2 en firebaseConfig.apiKey');
 const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
 await signInAnonymously(auth);
 estado.textContent='Firebase autenticado. Esperando datos de las dos estaciones.';
 for(const id of devices){
   onValue(ref(db,`sensores/${id}/actual`),snap=>{latest[id]=snap.val()||{};render(id);},err=>{estado.textContent=`Error leyendo ${id}: ${err.message}`;});
   onValue(query(ref(db,`sensores/${id}/historial`),orderByChild('fecha'),limitToLast(100)),snap=>{
     histories[id]=Object.values(snap.val()||{}).sort((a,b)=>Number(a.fecha)-Number(b.fecha));render(id);
   },err=>{estado.textContent=`Error del historial ${id}: ${err.message}`;});
 }
}catch(err){estado.textContent='Error Firebase: '+err.message;}
</script>
</body>
</html>
